<body>
	<!--
		Tesla Sentry Mode Viewer v2.0
		Author: Mrkl21full (Krystian)
		GitHub: https://github.com/Mrkl21full/SentryModeViewer
		License: GPL-3.0
		Description: Web-based viewer for Tesla Sentry Mode and Dashcam recordings
	-->
	<div class="sentry-viewer">
		<div class="sentry-viewer__main">
			<div class="sentry-viewer__top-overlay">
				<button class="sentry-viewer__menu-btn" data-menu-toggle aria-label="Open folder picker">
					<span class="sentry-viewer__menu-line"></span>
					<span class="sentry-viewer__menu-line"></span>
					<span class="sentry-viewer__menu-line"></span>
				</button>
				<div class="sentry-viewer__datetime" data-video-datetime>
					Select recording folder
				</div>
			</div>

			<div class="sentry-viewer__video-grid">
				<div class="sentry-viewer__video-grid-cell">
					<video class="sentry-viewer__video-grid-video" data-grid-video-type="front" muted playsinline preload="metadata"></video>
				</div>
				<div class="sentry-viewer__video-grid-cell">
					<video class="sentry-viewer__video-grid-video" data-grid-video-type="back" muted playsinline preload="metadata"></video>
				</div>
				<div class="sentry-viewer__video-grid-cell">
					<video class="sentry-viewer__video-grid-video" data-grid-video-type="left_repeater" muted playsinline preload="metadata"></video>
				</div>
				<div class="sentry-viewer__video-grid-cell">
					<video class="sentry-viewer__video-grid-video" data-grid-video-type="right_repeater" muted playsinline preload="metadata"></video>
				</div>
				<div class="sentry-viewer__video-grid-cell hidden">
					<video class="sentry-viewer__video-grid-video" data-grid-video-type="left_pillar" muted playsinline preload="metadata"></video>
				</div>
				<div class="sentry-viewer__video-grid-cell hidden">
					<video class="sentry-viewer__video-grid-video" data-grid-video-type="right_pillar" muted playsinline preload="metadata"></video>
				</div>
			</div>

			<div class="sentry-viewer__bottom-controls">
				<button class="sentry-viewer__jump-btn" data-jump-to-event>Jump to Event</button>

				<div class="sentry-viewer__playback-panel">
					<button class="sentry-viewer__playback-btn" data-rewind-15 aria-label="Rewind 15 seconds">
						<i class="fa-solid fa-rotate-left"></i>
						<span class="sentry-viewer__playback-label">15</span>
					</button>
					<button class="sentry-viewer__playback-btn sentry-viewer__playback-btn--play" data-video-toggle aria-label="Play/Pause">
						<i class="fa-solid fa-play"></i>
					</button>
					<button class="sentry-viewer__playback-btn" data-forward-15 aria-label="Forward 15 seconds">
						<i class="fa-solid fa-rotate-right"></i>
						<span class="sentry-viewer__playback-label">15</span>
					</button>
				</div>
			</div>

			<div class="sentry-viewer__progress-container" role="progressbar" aria-label="Video progress">
				<div class="sentry-viewer__progress-bar" data-playback-slider-tracker>
					<div class="sentry-viewer__progress-fill"></div>
				</div>
				<div class="sentry-viewer__event-marker" data-playback-slider-tracker-event></div>
			</div>
		</div>

		<div class="sentry-viewer__camera-selector">
			<div class="sentry-viewer__thumb sentry-viewer__thumb--active" data-camera-position="grid">
				<div class="sentry-viewer__thumb-preview">
					<div class="sentry-viewer__thumb-grid">
						<div class="sentry-viewer__thumb-grid-cell">
							<video class="sentry-viewer__thumb-grid-video" data-thumb-grid-type="front" muted playsinline preload="metadata"></video>
						</div>
						<div class="sentry-viewer__thumb-grid-cell">
							<video class="sentry-viewer__thumb-grid-video" data-thumb-grid-type="back" muted playsinline preload="metadata"></video>
						</div>
						<div class="sentry-viewer__thumb-grid-cell">
							<video class="sentry-viewer__thumb-grid-video" data-thumb-grid-type="left_repeater" muted playsinline preload="metadata"></video>
						</div>
						<div class="sentry-viewer__thumb-grid-cell">
							<video class="sentry-viewer__thumb-grid-video" data-thumb-grid-type="right_repeater" muted playsinline preload="metadata"></video>
						</div>
					</div>
				</div>
				<span class="sentry-viewer__thumb-label">Grid</span>
			</div>

			<div class="sentry-viewer__thumb" data-camera-position="front">
				<video class="sentry-viewer__thumb-video" data-video-type="front" muted playsinline preload="metadata"></video>
				<span class="sentry-viewer__thumb-label">Front</span>
			</div>

			<div class="sentry-viewer__thumb" data-camera-position="rear">
				<video class="sentry-viewer__thumb-video" data-video-type="back" muted playsinline preload="metadata"></video>
				<span class="sentry-viewer__thumb-label">Rear</span>
			</div>

			<div class="sentry-viewer__thumb" data-camera-position="left-repeater">
				<video class="sentry-viewer__thumb-video" data-video-type="left_repeater" muted playsinline preload="metadata"></video>
				<span class="sentry-viewer__thumb-label">Left</span>
			</div>

			<div class="sentry-viewer__thumb" data-camera-position="right-repeater">
				<video class="sentry-viewer__thumb-video" data-video-type="right_repeater" muted playsinline preload="metadata"></video>
				<span class="sentry-viewer__thumb-label">Right</span>
			</div>

			<div class="sentry-viewer__thumb" data-camera-position="left-pillar">
				<video class="sentry-viewer__thumb-video" data-video-type="left_pillar" muted playsinline preload="metadata"></video>
				<span class="sentry-viewer__thumb-label">Left Pillar</span>
			</div>

			<div class="sentry-viewer__thumb" data-camera-position="right-pillar">
				<video class="sentry-viewer__thumb-video" data-video-type="right_pillar" muted playsinline preload="metadata"></video>
				<span class="sentry-viewer__thumb-label">Right Pillar</span>
			</div>
		</div>
	</div>
